# Dependabot version updates. Cooldown keys: default-days, semver-major-days,
# semver-minor-days, semver-patch-days (see Dependabot options reference).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: batch/merge-private-into-public
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: batch/merge-private-into-public
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
