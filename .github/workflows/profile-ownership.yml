# Invite-only profile ownership — decision function has no network; uses PR event ids only.
name: Profile ownership

on:
  pull_request:

concurrency:
  group: profile-ownership-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    name: profile-ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node@v5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Unit tests (decision function)
        run: node scripts/test-profile-ownership.mjs

      - name: Collect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" || true)
          {
            echo "files<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce ownership
        env:
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: node scripts/check-profile-ownership.mjs
