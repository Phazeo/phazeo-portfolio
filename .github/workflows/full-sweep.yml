name: Full sweep

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-sweep:
    name: full-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0 (tag v6.1.0^{} → this commit; published 2026-09-05)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Setup Node.js
        # actions/setup-node@v7.0.0 (tag v7.0.0 → this commit; published 2026-07-14)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Playwright e2e (full sweep)
        env:
          SCOPE_FULL: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          CHROME_PATH: /usr/bin/google-chrome
          PW_CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then
            echo "STOP: runner has no usable Chrome at CHROME_PATH=$CHROME_PATH"
            echo "Do not add a browser download or new dependency - report to maintainers."
            exit 1
          fi
          pnpm exec playwright test

      - name: Upload Playwright results
        if: failure()
        # actions/upload-artifact@v4.6.2 (tag v4.6.2 → this commit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-full-sweep
          path: test-results/
          retention-days: 7
