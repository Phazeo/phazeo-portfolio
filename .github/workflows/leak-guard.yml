# Leak guard - single entry point tools/guard/check-leaks.sh on every PR and push.
name: Leak guard

on:
  pull_request:
  push:

concurrency:
  group: leak-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-guard:
    name: check-leaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install poppler-utils (PDF text + metadata scanners)
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Setup Node.js
        # actions/setup-node@v7.0.0 (tag v7.0.0 → this commit; published 2026-07-14)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Wiring test (only tools/guard/check-leaks.sh)
        run: node --test tests/unit/leak-guard-wiring.test.ts

      - name: Public boundary unit tests
        run: node --test tests/unit/public-boundary.test.ts

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: sh tools/guard/check-leaks.sh --commits "origin/${BASE_REF}..${HEAD_SHA}"

      - name: Scan push commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: sh tools/guard/check-leaks-on-push.sh "$BEFORE" "$HEAD_SHA"
      - name: Scan full working tree
        run: sh tools/guard/check-leaks.sh --tree
