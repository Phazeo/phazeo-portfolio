name: CI

on:
  push:
    branches: [main, master, "batch/**", "batch-*/**"]
  pull_request:
    branches: [main, master, "batch/**", "batch-*/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scope for changed-profile checks. On push events these are empty / not pull_request,
      # so every check runs its full (non-PR) path. Prefer GITHUB_BASE_SHA over origin/<ref>.
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests need full history so the changed-scope diff can find the merge base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0 (tag v6.1.0^{} → this commit; published 2026-09-05)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Setup Node.js
        # actions/setup-node@v7.0.0 (tag v7.0.0 → this commit; published 2026-07-14)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality check (lint + typecheck + registry)
        run: pnpm quality

      - name: Build
        run: pnpm build

      - name: Verify headers match build
        run: pnpm check:headers

      - name: Prove CSP in Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then
            echo "STOP: runner has no usable Chrome at CHROME_PATH=$CHROME_PATH"
            echo "Do not add a browser download or new dependency - report to maintainers."
            exit 1
          fi
          pnpm prove:csp

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi
          if [ ! -f "dist/_headers" ]; then
            echo "Build failed: _headers not found"
            exit 1
          fi
          if [ ! -f "dist/_redirects" ]; then
            echo "Build failed: _redirects not copied to dist"
            exit 1
          fi
          echo "Build verification successful"
          ls -lah dist/
