# Deploy the site on push to main: static files only, no server-side script.
# The build job holds no secret. The deploy job runs in the "production"
# Environment and receives only the built files and the deploy token.
# This is the only file allowed to name the deploy action and its tool
# (config/policy/boundary-path-allowances.txt).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    # A manual run from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Same scope variables as CI; on push and dispatch every check runs its full path.
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        # pnpm/action-setup@v6.1.0 (tag v6.1.0^{} → this commit; published 2026-09-05)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Setup Node.js
        # actions/setup-node@v7.0.0 (tag v7.0.0 → this commit; published 2026-07-14)
        # No dependency cache in a deploy workflow (cache poisoning).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality check (lint + typecheck + registry)
        run: pnpm quality

      - name: Build
        run: pnpm build

      - name: Verify headers match build
        run: pnpm check:headers

      - name: Upload built site
        # actions/upload-artifact@v7.0.1 (tag v7.0.1 → this commit; published 2026-04-10)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy site
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
    env:
      SITE_NAME: phazeo-portfolio
      SITE_COMPATIBILITY_DATE: "2026-10-01"
    steps:
      # The repository goes to repo/ so no package.json sits above site/,
      # where the deploy tool is installed on its own.
      - name: Checkout deploy helpers
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Setup Node.js
        # actions/setup-node@v7.0.0 (tag v7.0.0 → this commit; published 2026-07-14)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "repo/.nvmrc"
          package-manager-cache: false

      - name: Download built site
        # actions/download-artifact@v8.0.1 (tag v8.0.1 → this commit; published 2026-03-11)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site/dist

      - name: Write and check the deploy config (refuses any server-side script)
        working-directory: site
        run: |
          node ../repo/tools/deploy/site-config.ts refuse-tracked --root ../repo --stem wrangler
          node ../repo/tools/deploy/site-config.ts write --out site-deploy.json \
            --name "$SITE_NAME" --compatibility-date "$SITE_COMPATIBILITY_DATE" --assets dist
          node ../repo/tools/deploy/site-config.ts check --config site-deploy.json
          printf '{ "name": "site-deploy", "private": true }\n' > package.json

      - name: Deploy
        # cloudflare/wrangler-action@v4.1.3 (tag v4.1.3^{} → this commit; published 2026-09-24)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          # The tool is installed without install scripts, resolving only
          # versions published before this date (dependency cooldown).
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_BEFORE: "2026-10-03T00:00:00Z"
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        with:
          apiToken: ${{ secrets.SITE_DEPLOY_TOKEN }}
          accountId: ${{ vars.SITE_ACCOUNT_ID }}
          # 4.147.0 published 2026-10-02 (14-day cooldown).
          wranglerVersion: "4.147.0"
          packageManager: npm
          workingDirectory: site
          command: deploy --config site-deploy.json

      # Runs only once the repository variable SITE_DOMAIN names the attached domain.
      - name: Verify live headers
        id: verify
        if: vars.SITE_DOMAIN != ''
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          set +e
          node repo/tools/deploy/verify-live-headers.ts --headers site/dist/_headers \
            --domain "$SITE_DOMAIN" --allowed-hosts repo/config/policy/allowed-hosts.txt \
            --timeout-seconds 60 --interval-seconds 5
          rc=$?
          set -e
          case "$rc" in
            0) echo "match=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "match=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # A mismatch is a step output, not a failure, so the secret step below
      # runs only after every earlier step succeeded.
      - name: Roll back to the previous version
        if: steps.verify.outputs.match == 'false'
        # cloudflare/wrangler-action@v4.1.3 (tag v4.1.3^{} → this commit; published 2026-09-24)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_BEFORE: "2026-10-03T00:00:00Z"
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        with:
          apiToken: ${{ secrets.SITE_DEPLOY_TOKEN }}
          accountId: ${{ vars.SITE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          packageManager: npm
          workingDirectory: site
          command: rollback --config site-deploy.json --message "Live headers did not match the build"

      - name: Fail after rollback
        if: steps.verify.outputs.match == 'false'
        run: |
          echo "Live headers did not match the build; rolled back to the previous version."
          exit 1
