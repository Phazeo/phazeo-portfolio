# OpenSSF Scorecard - weekly and on push to main.
name: Scorecard

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 (tag v7.0.1 → this commit; published 2026-07-20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # ossf/scorecard-action@v2.4.4 (tag v2.4.4 → this commit; published 2026-07-23)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        # github/codeql-action/upload-sarif@v3.38.2 (tag v3.38.2 → this commit; published 2026-09-24)
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
